# vim:fileencoding=utf-8:foldmethod=marker
# ╭──────────────────────────────────────────────────────────────────────────╮
# │                    Kitty Terminal Configuration                          │
# │                  Elegant setup for programming                           │
# ╰──────────────────────────────────────────────────────────────────────────╯

# ── Fonts ─────────────────────────────────────────────────────────────────────
#{{{

font_family      family="IosevkaTerm Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size        13.0

# Ligatures for programming
disable_ligatures never

# Line/column adjustments
adjust_line_height  108%
adjust_column_width 0

#}}}

# ── Cursor ────────────────────────────────────────────────────────────────────
#{{{

cursor_shape              beam
cursor_beam_thickness     1.5
cursor_blink_interval     0.5
cursor_stop_blinking_after 15.0

#}}}

# ── Scrollback ────────────────────────────────────────────────────────────────
#{{{

scrollback_lines 10000

#}}}

# ── Mouse ─────────────────────────────────────────────────────────────────────
#{{{

mouse_hide_wait       3.0
copy_on_select        clipboard
strip_trailing_spaces smart
url_style             curly

#}}}

# ── Terminal bell ─────────────────────────────────────────────────────────────
#{{{

enable_audio_bell    no
visual_bell_duration 0.0

#}}}

# ── Window ────────────────────────────────────────────────────────────────────
#{{{

remember_window_size yes
window_padding_width 10

# Don't ask for confirmation when closing the window
confirm_os_window_close 0

#}}}

# ── Color scheme — Oxocarbon (IBM Carbon Design System) ──────────────────────
#{{{

foreground           #f2f4f8
background           #161616

selection_foreground #f2f4f8
selection_background #525252

cursor               #78a9ff
cursor_text_color    #161616

url_color            #33b1ff

# Black / Bright Black
color0  #262626
color8  #525252

# Red / Bright Red  (IBM Magenta / Pink)
color1  #ee5396
color9  #ff7eb6

# Green / Bright Green  (IBM Green)
color2  #42be65
color10 #42be65

# Yellow / Bright Yellow  (IBM Yellow)
color3  #ffe97b
color11 #ffe97b

# Blue / Bright Blue  (IBM Blue)
color4  #78a9ff
color12 #33b1ff

# Magenta / Bright Magenta  (IBM Purple)
color5  #be95ff
color13 #be95ff

# Cyan / Bright Cyan  (IBM Teal)
color6  #3ddbd9
color14 #08bdba

# White / Bright White
color7  #dde1e6
color15 #f2f4f8

#}}}

# ── Advanced ──────────────────────────────────────────────────────────────────
#{{{

# Shell integration: auto-detect CWD, disable title (tmux manages titles)
shell_integration enabled no-title

# Allow remote control only from same user via socket
allow_remote_control socket-only
listen_on            unix:/tmp/kitty-{kitty_pid}

open_url_with default

wayland_titlebar_color background

#}}}

# ── Keyboard shortcuts ────────────────────────────────────────────────────────
#{{{

kitty_mod ctrl+shift

# ---- Font size ----------------------------------------------------------

map kitty_mod+equal      increase_font_size
map kitty_mod+plus       increase_font_size
map kitty_mod+minus      decrease_font_size
map kitty_mod+0          reset_font_size

# ---- Clipboard ----------------------------------------------------------

map kitty_mod+c          copy_to_clipboard
map kitty_mod+v          paste_from_clipboard
map kitty_mod+s          paste_from_selection

# ---- Scrollback ---------------------------------------------------------

map kitty_mod+up         scroll_line_up
map kitty_mod+down       scroll_line_down
map kitty_mod+page_up    scroll_page_up
map kitty_mod+page_down  scroll_page_down
map kitty_mod+home       scroll_home
map kitty_mod+end        scroll_end

# Browse scrollback in less/nvim
map kitty_mod+f          show_scrollback

# ---- Misc ---------------------------------------------------------------

# Edit config and reload
map kitty_mod+F2         edit_config_file
map kitty_mod+F5         load_config_file

# Toggle fullscreen / maximize
map kitty_mod+F11        toggle_fullscreen
map kitty_mod+F10        toggle_maximized

# Command palette (search all actions)
map kitty_mod+p          command_palette

#}}}
