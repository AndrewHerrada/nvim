# True color settings
set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"
set-option -sa terminal-features ',xterm-256color:RGB'

set-window-option -g xterm-keys on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set-option -gw xterm-keys on
set -gq allow-passthrough on

# Shell
set -g default-command $SHELL
set -g default-shell $SHELL

# Remove esc delay
set -sg escape-time 0

# History
set -g history-limit 10000

# Focusing
set-option -g focus-events on

# Vi mode
setw -g mode-keys vi
set -g status-keys vi

# Mouse (off by default, toggle with prefix+m)
set -g mouse off
bind m set -g mouse \; display "█▓░ mouse: #{?mouse,ON,OFF}"

# Start windows and panes at 1
set -g base-index 1
set -g renumber-windows on
setw -g pane-base-index 1

set -g wrap-search off

# ═══════════════════════════════════════════════════════════════════
# Prefix
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# ═══════════════════════════════════════════════════════════════════
# Core bindings
bind r source-file ~/.config/tmux/tmux.conf \; display "█▓░ reloaded"
bind : command-prompt
bind x kill-pane
bind t set status
bind a set-window-option synchronize-panes \; display-message "█▓░ synchronize"

# ═══════════════════════════════════════════════════════════════════
# Pane splits
unbind %
bind-key -n M-\\ split-window -h -c "#{pane_current_path}"
unbind '"'
bind-key -n M-- split-window -v -c "#{pane_current_path}"
unbind p
bind p split-window -v -c "#{pane_current_path}"

# Resize
bind -n C-M-j resize-pane -D 3
bind -n C-M-k resize-pane -U 3
bind -n C-M-l resize-pane -R 3
bind -n C-M-h resize-pane -L 3

# Toggle fullscreen
bind -n M-m resize-pane -Z

# Navigate panes
bind-key -n 'M-h' select-pane -L
bind-key -n 'M-j' select-pane -D
bind-key -n 'M-k' select-pane -U
bind-key -n 'M-l' select-pane -R

# Swap panes
bind -n M-K swap-pane -U
bind -n M-J swap-pane -D

# ═══════════════════════════════════════════════════════════════════
# Layouts
bind -n M-v select-layout main-vertical
bind -n M-z select-layout main-horizontal
bind -n M-V select-layout even-vertical
bind -n M-Z select-layout even-horizontal

# ═══════════════════════════════════════════════════════════════════
# Windows
unbind n
bind n new-window -c "#{pane_current_path}"
bind -n M-p previous-window
bind -n M-n next-window
bind -n M-H swap-window -t +1
bind -n M-L swap-window -t -1
bind-key -n M-s set-option -g status

# ═══════════════════════════════════════════════════════════════════
# Copy mode (vi style)
unbind [
bind escape copy-mode
bind-key -n M-y copy-mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "yank" \; send-keys enter
bind-key -T copy-mode-vi 'Y' send -X copy-pipe-and-cancel "tmux loadb -" \; send-keys enter

# ═══════════════════════════════════════════════════════════════════
# Clipboard / menus
set -s set-clipboard on
set -ag terminal-overrides "vte*:XT:Ms=\\E]52;c;%p2%s\\7,xterm*:XT:Ms=\\E]52;c;%p2%s\\7"
bind space display-popup -b "heavy" -S 'bg=#161616,fg=#78a9ff' -w 70% -h 70% -E "CM_OUTPUT_CLIP=1 clipmenu | yank"
bind e     display-popup -b "heavy" -S 'bg=#161616,fg=#78a9ff' -w 70% -h 70% -E "emoji"

# panes
set -g pane-border-lines "heavy"
set -g pane-border-style "bg=#161616,fg=#ee5396"
set -g pane-active-border-style "bg=#161616,fg=#ee5396"
set -g window-active-style 'bg=terminal'
set -g window-style 'bg=#161616'

# status line
set -g status-justify left
set -g status-style "bg=terminal,fg=#42be65"
set -g status-interval 2

# messaging
set -g message-style "bg=#78a9ff,fg=#42be65"
set -g message-command-style "bg=#be95ff,fg=#42be65"

# window mode
setw -g mode-style "bg=#393939,fg=#78a9ff"

# window status
set-option -g status-position bottom
setw -g window-status-format         " #[bg=#78a9ff,fg=#161616,noreverse]▓░ #W "
setw -g window-status-current-format " #[bg=#42be65,fg=#161616,noreverse]▓░ #W "

# loud or quiet?
set-option -g visual-activity on
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# tmux clock
set -g clock-mode-color "#78a9ff"

# Status content
set -g status-left-length 10
set -g status-right-length 120
set -g status-left  '#{tmux_mode_indicator}'
set -g status-right '#(~/.local/bin/tmux-status)'

# ═══════════════════════════════════════════════════════════════════
# TPM plugins
bind-key -n M-i run-shell '~/.config/tmux/plugins/tpm/bin/install_plugins'
set -g @plugin 'tmux-plugins/tpm'
setenv -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

# Session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Text picker (tmux-thumbs) — prefix+f to pick visible text
set -g @plugin 'fcsonline/tmux-thumbs'
unbind f
set -g @thumbs-key f
set -g @thumbs-contrast 1
set -g @thumbs-bg-color      '#78a9ff'
set -g @thumbs-fg-color      '#161616'
set -g @thumbs-hint-bg-color '#42be65'
set -g @thumbs-hint-fg-color '#161616'
set -g @thumbs-select-bg-color '#be95ff'
set -g @thumbs-select-fg-color '#161616'
set -g @thumbs-command 'printf "{}" | yank'

# Mode indicator (shows prefix/copy/sync state)
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @mode_indicator_empty_prompt    ' ◇ '
set -g @mode_indicator_empty_mode_style  'bg=term,fg=#42be65'
set -g @mode_indicator_prefix_prompt   ' ◈ '
set -g @mode_indicator_prefix_mode_style 'bg=#42be65,fg=#161616'
set -g @mode_indicator_copy_prompt     '  '
set -g @mode_indicator_copy_mode_style   'bg=#42be65,fg=#161616'
set -g @mode_indicator_sync_prompt     '   '
set -g @mode_indicator_sync_mode_style   'bg=#3ddbd9,fg=#161616'

# Initialize TPM (keep at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
