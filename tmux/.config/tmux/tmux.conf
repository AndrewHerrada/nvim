# True color settings
set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"

set-window-option -g xterm-keys on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set-option -gw xterm-keys on
set -gq allow-passthrough on

# Changing prefix to C-a
set -g prefix C-a
unbind C-b
unbind M-s
bind-key C-a send-prefix

# Refresh tmux
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded"

# Mouse
set -g mouse off
bind m set -g mouse \; display "Mouse: #{?mouse,ON,OFF}"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g renumber-windows on

set -g wrap-search off
# =========================================================================================
# Panes
setw -g pane-base-index 1

# Rebinding split Keys
unbind % 
bind-key -n M-\\ split-window -h -c "#{pane_current_path}"
unbind '"'
bind-key -n M-- split-window -v -c "#{pane_current_path}"
unbind p
bind p split-window -v -c "#{pane_current_path}"

# For resizing 
bind -n C-M-j resize-pane -D 3
bind -n C-M-k resize-pane -U 3
bind -n C-M-l resize-pane -R 3
bind -n C-M-h resize-pane -L 3

# toggle fullscreen
bind -n M-m resize-pane -Z

# Setting up Keys for navigating panes
bind-key -n 'M-h' select-pane -L
bind-key -n 'M-j' select-pane -D
bind-key -n 'M-k' select-pane -U
bind-key -n 'M-l' select-pane -R

# Switch panes
bind -n M-K swap-pane -U
bind -n M-J swap-pane -D

# =========================================================================================
# Layouts
bind -n M-v select-layout main-vertical
bind -n M-z select-layout main-horizontal
bind -n M-V select-layout even-vertical
bind -n M-Z select-layout even-horizontal

# =========================================================================================
# Windows
# Navigating through opened windows
bind -n M-p previous-window
bind -n M-n next-window

# Shifting window positions
bind -n M-H swap-window -t +1
bind -n M-L swap-window -t -1

# New window
unbind n

bind n new-window -c "#{pane_current_path}"

bind-key -n M-s set-option -g status

bind-key -n M-y copy-mode

# =========================================================================================
# Bar Settings
set-option -g status-position top
# set-option -g status-interval 1

set-option -g status-justify left
set -g status-left-length 85
set -g status-style 'bg=default,fg=#9eabac'
set-option -g status-right '#[bg=#d23681,fg=#001014,bold] #S '
set-option -g status-left ''

set -g window-status-format "#[fg=#9eabac,bg=#063540,bold]  #I #[fg=#9eabac,bg=#002c38,bold] #W "
set -g window-status-current-format "#[fg=#001014,bg=#d23681,bold]  #I #[fg=#001014,bg=#b28500,bold] #W "

set -g message-style bg=#d23681,fg=#001014,bold
set -g message-command-style bg=#001014,fg=#d23681,bold

set -g pane-active-border-style fg=#d23681
set -g pane-border-style fg=#063540

# Install TPM plugins
bind-key -n M-i run-shell '~/.config/tmux/plugins/tpm/bin/install_plugins'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum: auto-save every 15 min and restore on tmux start
set -g @continuum-restore 'on'

# Initialize TPM (keep at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'

